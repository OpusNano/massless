[package]
name = "massless"
version = "0.1.0"
edition = "2024"
description = "Tiny, fast Markdown blog server"
license-file = "LICENSE"
publish = false

[dependencies]
tiny_http = { version = "0.12", default-features = false }

# Rendering happens in build.rs; the runtime binary has no Markdown code.
[build-dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Only for the render module unit tests.
[dev-dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
