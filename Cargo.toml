[package]
name = "massless"
version = "0.1.0"
edition = "2024"
description = "Tiny, fast Markdown blog server"
license-file = "LICENSE"
publish = false

[dependencies]
tiny_http = { version = "0.12", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
