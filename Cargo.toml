[package]
name = "massless"
version = "0.1.0"
edition = "2024"
description = "Tiny, fast Markdown blog server"
license-file = "LICENSE"
publish = false

[dependencies]
tiny_http = { version = "0.12", default-features = false }
# Dev mode only (feature `dev`): re-renders in memory at runtime.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }

[features]
# Live re-rendering with browser reload over SSE. Off by default.
dev = ["dep:pulldown-cmark"]

# Rendering happens in build.rs; the runtime binary has no Markdown code.
[build-dependencies]
brotli = { version = "9.1.3", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
zopfli = { version = "0.8.4", default-features = false, features = ["gzip", "std"] }

# Only for the render module unit tests.
[dev-dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# tiny_http 0.12 with robustness fixes (timeouts, limits, no panics on input);
# see vendor/tiny_http/PATCHES.md.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
